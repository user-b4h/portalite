<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portalite | シンプルなポータルアプリ</title>
  <meta name="description" content="Portaliteは、ウェブ検索、天気予報、最新ニュースを一つの画面で手軽に確認できるシンプルなポータルアプリです。シンプルで使いやすいデザインで、PCとスマホどちらでも快適にご利用いただけます。">
  <meta name="keywords" content="ポータルサイト, 検索, 天気, ニュース, webアプリ, シンプル, 便利">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="icon/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
  <link rel="manifest" href="json/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "06756929-5b9d-4f9e-9e9b-30a366515d24",
      });
    });
  </script>
</head>
<body class="p-4 sm:p-8 flex flex-col items-center min-h-screen text-base sm:text-lg">
  <div id="preloader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center">
    <img src="icon/icon.svg" alt="Portalite Logo" class="w-32 h-32 mb-4">
    <p class="text-3xl font-bold">Portalite</p>
  </div>
  <div id="sticky-search-bar">
    <div class="max-w-4xl mx-auto p-3">
      <div class="relative">
        <i class="fas fa-search search-icon"></i>
        <input id="search-input-sticky" type="search" placeholder="検索キーワードを入力..." readonly
               class="w-full p-3 pl-9 pr-4 rounded-2xl border border-gray-300 text-base focus:outline-none cursor-pointer
                      dark:bg-gray-800 dark:border-gray-500 dark:text-gray-100 dark:placeholder-gray-400">
      </div>
    </div>
  </div>
  <main id="main-content" class="hidden w-full max-w-4xl space-y-8 pointer-events-none">
    <header class="text-center">
      <h1 class="text-5xl sm:text-6xl font-bold mb-2">Portalite</h1>
      <p class="text-xl">シンプルなポータルアプリ</p>
    </header>
    <section class="card p-6 rounded-3xl shadow-lg relative">
      <h2 class="text-2xl sm:text-3xl font-semibold mb-4">ウェブを検索</h2>
      <div id="search-container-wrapper">
        <form action="#" id="search-form-main" onsubmit="event.preventDefault(); doSearch(document.getElementById('search-input-main').value.trim());">
          <div class="input-group flex space-x-2 items-center">
            <div class="relative flex-grow min-w-0">
              <i class="fas fa-search search-icon"></i>
              <input id="search-input-main" type="search" placeholder="検索キーワードを入力..."
                     class="w-full p-3 pl-9 pr-12 rounded-2xl border border-gray-300 text-base focus:outline-none
                            dark:bg-gray-800 dark:border-gray-500 dark:text-gray-100 dark:placeholder-gray-400"
                     autocomplete="off">
              <i id="clear-button-main" class="fas fa-times-circle clear-button hidden"></i>
              <div id="suggestions-container-main"
                   class="absolute z-10 w-full mt-2 bg-white dark:bg-gray-700 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-600 hidden text-base sm:text-lg">
              </div>
            </div>
            <button type="button" id="qr-scan-button-main" class="flex-shrink-0 accent-text text-2xl" aria-label="QRコードを読み取る">
              <i class="fas fa-qrcode"></i>
            </button>
          </div>
        </form>
      </div>
    </section>
    <section class="card p-6 rounded-3xl shadow-lg">
      <h2 class="text-2xl sm:text-3xl font-semibold mb-4">よく使う項目</h2>
      <div id="links-container" class="space-y-4">
        <a href="https://mypage.transit-jr.net/login/" target="_blank" rel="noopener noreferrer" class="link-item">
          <span class="font-medium text-gray-800 dark:text-gray-200 text-base sm:text-lg">あしあと帳。</span>
        </a>
        <button id="kanji-check-button" type="button" class="link-item w-full text-left">
          <span class="font-medium text-gray-800 dark:text-gray-200 text-base sm:text-lg">
            漢字チェック
          </span>
        </button>
        <a href="https://user-x45.github.io/lunch-menu/" target="_blank" rel="noopener noreferrer" class="link-item">
          <span class="font-medium text-gray-800 dark:text-gray-200 text-base sm:text-lg">給食だより</span>
        </a>
        <a href="https://user-x45.github.io/calc/" target="_blank" rel="noopener noreferrer" class="link-item">
          <span class="font-medium text-gray-800 dark:text-gray-200 text-base sm:text-lg">計算機</span>
        </a>
        <a href="https://ekibus.city.sapporo.jp/" target="_blank" rel="noopener noreferrer" class="link-item">
          <span class="font-medium text-gray-800 dark:text-gray-200 text-base sm:text-lg">さっぽろえきバスナビ</span>
        </a>
        <a href="https://www23.sapporo-c.ed.jp/houmei/" target="_blank" rel="noopener noreferrer" class="link-item">
          <span class="font-medium text-gray-800 dark:text-gray-200 text-base sm:text-lg">市立豊明高等支援学校</span>
        </a>
        <a href="https://transit.yahoo.co.jp/" target="_blank" rel="noopener noreferrer" class="link-item">
          <span class="font-medium text-gray-800 dark:text-gray-200 text-base sm:text-lg">Yahoo!路線情報</span>
        </a>
      </div>
    </section>
    <section class="card p-6 rounded-3xl shadow-lg">
      <h2 class="text-2xl sm:text-3xl font-semibold mb-4">今日は何の日</h2>
      <div id="anniversary-container" class="space-y-3 text-lg sm:text-xl">
        <div class="text-center">記念日情報を取得中...</div>
      </div>
    </section>
    <section class="card p-6 rounded-3xl shadow-lg">
      <h2 class="text-2xl sm:text-3xl font-semibold mb-4">自宅の室温</h2>
      <div id="room-temp-container" class="grid sm:grid-cols-3 gap-4 text-center text-base sm:text-lg">
        <div class="text-center col-span-3">室温情報を取得中...</div>
      </div>
    </section>
    <section class="card p-6 rounded-3xl shadow-lg">
      <h2 class="text-2xl sm:text-3xl font-semibold mb-4">札幌の天気</h2>
      <div id="weather-container" class="grid sm:grid-cols-3 gap-4 text-center text-base sm:text-lg">
        <div class="text-center col-span-3">天気情報を取得中...</div>
      </div>
    </section>
    <section class="card p-6 rounded-3xl shadow-lg">
      <h2 class="text-2xl sm:text-3xl font-semibold mb-4">エンタメニュース</h2>
      <div id="news-container" class="space-y-1 text-base sm:text-lg">
        <div class="text-center">ニュースを取得中...</div>
      </div>
    </section>
    <footer class="text-center text-gray-500 dark:text-gray-400 text-sm sm:text-base mt-8">
      <button id="customize-button" type="button" class="accent-text text-base sm:text-lg font-semibold mb-3 px-4 py-2">
        <i class="fas fa-palette mr-2"></i>カスタマイズ
      </button>
      <div><span id="copyright-text"></span></div>
    </footer>
  </main>
  <div id="search-overlay" class="hidden">
    <div class="p-4 flex items-center space-x-2 border-b border-gray-200 dark:border-gray-600">
      <form action="#" id="search-form-overlay" onsubmit="event.preventDefault(); doSearch(document.getElementById('search-input-overlay').value.trim());" class="relative flex-grow min-w-0 flex items-center space-x-2">
        <div class="relative flex-grow min-w-0">
          <i class="fas fa-search search-icon text-lg"></i>
          <input id="search-input-overlay" type="search"
                 class="w-full p-3 pl-9 pr-12 rounded-2xl border border-gray-300 text-lg focus:outline-none
                        dark:bg-gray-800 dark:border-gray-500 dark:text-gray-100 dark:placeholder-gray-400"
                 placeholder="検索キーワード..." autocomplete="off">
          <i id="clear-button-overlay" class="fas fa-times-circle clear-button hidden"></i>
        </div>
        <button type="button" id="qr-scan-button-overlay" class="flex-shrink-0 accent-text text-2xl" aria-label="QRコードを読み取る">
          <i class="fas fa-qrcode"></i>
        </button>
      </form>
      <button id="cancel-button"
              class="flex-shrink-0 accent-text font-semibold text-lg ml-1">
        キャンセル
      </button>
    </div>
    <div id="suggestions-container-overlay" class="flex-grow overflow-y-auto p-2 text-lg"></div>
  </div>
  <div id="kanji-overlay" class="hidden">
    <div id="kanji-inner" class="rounded-3xl shadow-xl max-w-2xl w-[90%] bg-white dark:bg-gray-800 sm:w-[90%] sm:max-w-2xl sm:rounded-3xl sm:shadow-xl sm:bg-white sm:dark:bg-gray-800">
    <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-600">
      <h3 class="text-xl font-semibold">漢字チェック</h3>
      <button id="kanji-cancel-button" class="accent-text font-semibold text-lg">閉じる</button>
    </div>
    <div class="flex-grow overflow-y-auto p-4">
      <textarea id="kanji-textarea" placeholder="ここに入力..." class="w-full h-[25vh] p-3 rounded-2xl border border-gray-300 text-4xl focus:outline-none dark:bg-gray-800 dark:border-gray-500 dark:text-gray-100 dark:placeholder-gray-400"></textarea>
      <div class="mt-3 flex items-center justify-end space-x-2">
        <button id="kanji-clear-button" class="px-4 py-2 rounded-2xl border border-gray-300 dark:border-gray-600">クリア</button>
      </div>
    </div>
  </div>
  </div>
  <div id="theme-overlay" class="hidden">
    <div id="theme-inner">
      <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-600">
        <h3 class="text-xl font-semibold">テーマカラー</h3>
        <button id="theme-cancel-button" class="accent-text font-semibold text-lg">閉じる</button>
      </div>
      <div class="p-6 grid grid-cols-3 gap-6" id="theme-swatches">
        <button type="button" class="theme-swatch" data-theme="blue" style="background:#3b82f6" aria-label="ブルー"></button>
        <button type="button" class="theme-swatch" data-theme="green" style="background:#10b981" aria-label="グリーン"></button>
        <button type="button" class="theme-swatch" data-theme="purple" style="background:#8b5cf6" aria-label="パープル"></button>
        <button type="button" class="theme-swatch" data-theme="pink" style="background:#ec4899" aria-label="ピンク"></button>
        <button type="button" class="theme-swatch" data-theme="orange" style="background:#f97316" aria-label="オレンジ"></button>
        <button type="button" class="theme-swatch" data-theme="red" style="background:#ef4444" aria-label="レッド"></button>
      </div>
    </div>
  </div>
  <div id="qr-overlay" class="hidden">
    <div id="qr-inner" class="rounded-3xl shadow-xl max-w-md w-[90%] bg-white dark:bg-gray-800 overflow-hidden">
      <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-600">
        <h3 class="text-xl font-semibold">QRコードを読み取る</h3>
        <button id="qr-cancel-button" class="accent-text font-semibold text-lg">閉じる</button>
      </div>
      <div class="p-4">
        <video id="qr-video" class="w-full rounded-2xl bg-black" autoplay playsinline muted></video>
        <canvas id="qr-canvas" class="hidden"></canvas>
        <p id="qr-status" class="text-center text-sm text-gray-500 dark:text-gray-400 mt-3">カメラを起動しています...</p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
